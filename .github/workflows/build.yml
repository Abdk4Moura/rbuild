# rbuild: compile a Rust binary from any public repo at a ref on GitHub's free
# 4-core public-repo runner, and hand it back as an artifact.
#
# Lives in its own repo so build runs never clutter the source repo's Actions
# view, and so a dispatch-only workflow is registered (GitHub only registers
# those from the default branch). Driven by bin/rbuild, which finds its run by
# the `tag` input in the run name. Private source repos need a SOURCE_TOKEN
# secret with contents:read on them.

name: build

run-name: "${{ inputs.tag }} ${{ inputs.repo }}@${{ inputs.ref }} ${{ inputs.target }} ${{ inputs.profile }}"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Opaque id the caller uses to find this run
        required: true
        type: string
      repo:
        description: Source repository, owner/name
        required: true
        type: string
      ref:
        description: Branch, tag, or sha to build
        required: true
        type: string
      manifest_dir:
        description: Directory containing the Cargo.toml to build
        required: false
        default: "."
        type: string
      bin:
        description: Binary name to collect from target/
        required: true
        type: string
      target:
        description: Rust target triple
        required: false
        default: x86_64-unknown-linux-musl
        type: string
      profile:
        description: Cargo profile (release, dev, or any custom profile the crate defines)
        required: false
        default: release
        type: string
      features:
        description: Feature flags, passed verbatim (e.g. "--features static")
        required: false
        default: ""
        type: string
      cargo_args:
        description: Extra cargo arguments, passed verbatim
        required: false
        default: ""
        type: string
      run_tests:
        description: Also run cargo test in manifest_dir
        required: false
        default: false
        type: boolean
      retention_days:
        description: Artifact retention in days
        required: false
        default: "7"
        type: string
      no_cache:
        description: Measurement mode, start with every cache cold (target dir and sccache)
        required: false
        default: false
        type: boolean

env:
  RUSTC_WRAPPER: sccache
  CARGO_INCREMENTAL: "0"
  CMAKE_C_COMPILER_LAUNCHER: sccache
  CMAKE_CXX_COMPILER_LAUNCHER: sccache

jobs:
  build:
    name: "${{ inputs.repo }}@${{ inputs.ref }} ${{ inputs.target }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_TOKEN || github.token }}
      # Layer 1: the target/ dir itself, keyed on repo+target+profile+lockfile,
      # via the GitHub Actions cache. Unchanged deps then need no compile at
      # all, and it keeps builds warm if R2 is down or unconfigured.
      - name: Cache target dir
        if: ${{ !inputs.no_cache }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.manifest_dir }}
          shared-key: ${{ inputs.repo }}-${{ inputs.target }}-${{ inputs.profile }}
          cache-on-failure: true
          cache-all-crates: true
      # Layer 2: sccache, shared R2 bucket when configured (below), else the
      # Actions cache. Catches what the target cache misses: a changed lockfile
      # still hits on every unchanged crate.
      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Compile cache backend
        # Shared R2 bucket when the secrets exist (warm across repos, machines
        # and the Codespace), else the per-repo Actions cache. Selected in a
        # step because `secrets` is not usable in a step-level `if`.
        shell: bash
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'sccache' }}
          NO_CACHE: ${{ inputs.no_cache }}
        run: |
          PREFIX="${{ inputs.repo }}/"
          if [ "$NO_CACHE" = "true" ]; then
            # Measurement runs write to a throwaway namespace so they neither
            # benefit from nor pollute the shared cache.
            PREFIX="_nocache/${GITHUB_RUN_ID}/"
            echo "SCCACHE_GHA_VERSION=nocache-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
            echo "measurement mode: all caches cold"
          fi
          R2_OK=0
          if [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ] && [ -n "$R2_ACCOUNT_ID" ]; then
            # Probe before committing: sccache aborts the whole build on a 401,
            # so a present-but-invalid token must degrade like a missing one.
            : > probe.body   # aws cli rejects /dev/null as a --body ("must be a path to a file")
            if AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" AWS_DEFAULT_REGION=auto \
               AWS_REQUEST_CHECKSUM_CALCULATION=when_required AWS_RESPONSE_CHECKSUM_VALIDATION=when_required \
               timeout 20 aws --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" s3api put-object \
                 --bucket "$R2_BUCKET" --key "${PREFIX}.rbuild_probe" --body probe.body >/dev/null 2>probe.err; then
              R2_OK=1
            else
              echo "::warning::R2 credentials rejected ($(tr -d '\n' < probe.err | cut -c1-160)); falling back to the Actions cache"
            fi
          fi
          if [ "$R2_OK" = 1 ]; then
            {
              echo "SCCACHE_BUCKET=$R2_BUCKET"
              echo "SCCACHE_ENDPOINT=https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
              echo "SCCACHE_REGION=auto"
              echo "SCCACHE_S3_USE_SSL=true"
              echo "SCCACHE_S3_KEY_PREFIX=$PREFIX"
              echo "AWS_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID"
              echo "AWS_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY"
            } >> "$GITHUB_ENV"
            echo "compile cache: R2 s3://$R2_BUCKET/$PREFIX"
          else
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
            echo "compile cache: GitHub Actions cache (R2 unset or rejected; see README for the shared bucket)"
          fi
      - name: musl toolchain
        if: contains(inputs.target, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - name: aarch64 cross linker
        if: startsWith(inputs.target, 'aarch64')
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q gcc-aarch64-linux-gnu
          mkdir -p ~/.cargo
          printf '[target.%s]\nlinker = "aarch64-linux-gnu-gcc"\n' "${{ inputs.target }}" >> ~/.cargo/config.toml
      - name: Toolchain
        shell: bash
        run: |
          # Respect a rust-toolchain file in the source if present; else stable.
          if [ ! -f rust-toolchain ] && [ ! -f rust-toolchain.toml ] && \
             [ ! -f "${{ inputs.manifest_dir }}/rust-toolchain" ] && [ ! -f "${{ inputs.manifest_dir }}/rust-toolchain.toml" ]; then
            rustup default stable
          fi
          rustup target add ${{ inputs.target }}
          rustc -V; cargo -V
      - name: Build
        id: build
        working-directory: ${{ inputs.manifest_dir }}
        shell: bash
        run: |
          set -euo pipefail
          # Common build-stamp env; harmless for crates that ignore it.
          export FILAMENT_BUILD_SHA="$(git rev-parse --short HEAD)"
          export FILAMENT_BUILD_DATE="$(date -u +%Y-%m-%d)"
          export RBUILD_SHA="$FILAMENT_BUILD_SHA"
          # Any profile works via --profile; cargo names the output dir after
          # the profile, except `dev` which lands in `debug`.
          PROFILE="${{ inputs.profile }}"; OUTDIR="$PROFILE"; [ "$PROFILE" = "dev" ] && OUTDIR="debug"
          start=$(date +%s)
          cargo build --profile "$PROFILE" --target "${{ inputs.target }}" ${{ inputs.features }} ${{ inputs.cargo_args }}
          echo "build_seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          echo "outdir=$OUTDIR" >> "$GITHUB_OUTPUT"
      - name: Test
        if: inputs.run_tests
        working-directory: ${{ inputs.manifest_dir }}
        shell: bash
        run: |
          cargo test --profile "${{ inputs.profile }}" --target "${{ inputs.target }}" ${{ inputs.features }}
      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          BIN="${{ inputs.manifest_dir }}/target/${{ inputs.target }}/${{ steps.build.outputs.outdir }}/${{ inputs.bin }}"
          mkdir -p out
          cp "$BIN" "out/${{ inputs.bin }}"
          {
            echo "repo=${{ inputs.repo }}"
            echo "ref=${{ inputs.ref }}"
            echo "sha=$(git rev-parse HEAD)"
            echo "bin=${{ inputs.bin }}"
            echo "target=${{ inputs.target }}"
            echo "profile=${{ inputs.profile }}"
            echo "features=${{ inputs.features }}"
            echo "cargo_args=${{ inputs.cargo_args }}"
            echo "build_seconds=${{ steps.build.outputs.build_seconds }}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > out/BUILD_INFO
          ls -la out; cat out/BUILD_INFO
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.bin }}-${{ inputs.target }}-${{ inputs.profile }}
          path: out/
          retention-days: ${{ fromJSON(inputs.retention_days) }}
          if-no-files-found: error
      - name: Show sccache stats
        if: always()
        run: sccache --show-stats
